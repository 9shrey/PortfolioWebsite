      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ib-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="#101012"/>
  <rect width="600" height="380" fill="url(#ib-wash)"/>

  <!-- faint tensor grid -->
  <g stroke="rgba(236,232,225,0.05)" stroke-width="1">
    <line x1="380" y1="30" x2="380" y2="130"/><line x1="410" y1="30" x2="410" y2="130"/>
    <line x1="440" y1="30" x2="440" y2="130"/><line x1="470" y1="30" x2="470" y2="130"/>
    <line x1="500" y1="30" x2="500" y2="130"/><line x1="530" y1="30" x2="530" y2="130"/>
    <line x1="560" y1="30" x2="560" y2="130"/>
    <line x1="380" y1="30" x2="568" y2="30"/><line x1="380" y1="55" x2="568" y2="55"/>
    <line x1="380" y1="80" x2="568" y2="80"/><line x1="380" y1="105" x2="568" y2="105"/>
    <line x1="380" y1="130" x2="568" y2="130"/>
