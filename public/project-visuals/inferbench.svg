  <text x="32" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#605b55">BATCHED DECODE THROUGHPUT</text>

  <text x="32" y="110" font-family="Georgia, serif" font-size="56" fill="#ece8e1">5.2<tspan font-family="Georgia, serif" font-style="italic" fill="#16a34a">×</tspan></text>
  <text x="32" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1" fill="#9a948b">END-TO-END · QWEN2.5-0.5B</text>

  <line x1="32" y1="160" x2="330" y2="160" stroke="rgba(236,232,225,0.08)" stroke-width="1"/>

  <!-- before/after throughput bars -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#9a948b">
    <text x="32" y="182">87 tok/s</text>
    <rect x="32" y="190" width="34" height="10" rx="2" fill="rgba(236,232,225,0.16)"/>
    <text x="32" y="222">451 tok/s</text>
    <rect x="32" y="230" width="176" height="10" rx="2" fill="url(#ib-bar)"/>
  </g>
  <text x="32" y="258" fill="#605b55">BATCH 16 · GREEDY TOKEN-IDENTICAL</text>

  <line x1="32" y1="276" x2="568" y2="276" stroke="rgba(236,232,225,0.08)" stroke-width="1"/>

  <text x="32" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#605b55">TRITON SPLIT-K KERNEL</text>
  <text x="32" y="336" font-family="Georgia, serif" font-size="26" fill="#ece8e1">8.9<tspan font-style="italic" fill="#16a34a">×</tspan> <tspan font-size="14" font-family="ui-monospace, monospace" fill="#9a948b">projection matmul</tspan></text>

  <text x="568" y="308" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1" fill="#9a948b">182 TESTS</text>
  <text x="568" y="326" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1" fill="#9a948b">52% MEM BANDWIDTH</text>
