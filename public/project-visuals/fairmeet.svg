<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset=".52" stop-color="#EAF2FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7C3AED"/><stop offset="1" stop-color="#20A4B8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1B2B48" flood-opacity=".14"/></filter>
    <style>
      .title{font:700 32px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}.kicker{font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748B}.chip{font:700 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#475569;text-transform:uppercase;letter-spacing:.08em}.node{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#243044}.small{font:700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748B}
    </style>
  </defs>
  <rect width="600" height="380" rx="34" fill="url(#bg)"/>
  <circle cx="92" cy="76" r="118" fill="#7C3AED" opacity=".15"/>
  <circle cx="502" cy="80" r="130" fill="#20A4B8" opacity=".14"/>
  <path d="M-20 306 C92 242 182 332 286 274 S492 214 640 282 V420 H-20 Z" fill="rgba(255,255,255,.42)"/>
  <text x="48" y="62" class="title">FairMeet</text>
  <text x="50" y="88" class="kicker">preferences + distance + fairness memory</text>
  <rect x="414" y="48" width="138" height="32" rx="16" fill="rgba(255,255,255,.68)" stroke="rgba(255,255,255,.78)"/><text x="432" y="69" class="chip">resume-only</text>
  <g filter="url(#shadow)">
    <rect x="54" y="148" width="138" height="138" rx="28" fill="rgba(255,255,255,.66)" stroke="rgba(255,255,255,.8)"/>
    <circle cx="123" cy="198" r="28" fill="#7C3AED" opacity=".88"/>
    <text x="84" y="252" class="node">People</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="230" y="122" width="142" height="190" rx="30" fill="rgba(255,255,255,.7)" stroke="rgba(255,255,255,.82)"/>
    <circle cx="301" cy="196" r="50" fill="url(#accent)" opacity=".92"/>
    <path d="M276 197 L294 216 L330 176" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    <text x="270" y="276" class="node">Fair score</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="410" y="148" width="138" height="138" rx="28" fill="rgba(255,255,255,.66)" stroke="rgba(255,255,255,.8)"/>
    <path d="M452 222 C464 196 492 196 506 222" stroke="#20A4B8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="479" cy="196" r="26" fill="#20A4B8" opacity=".88"/>
    <text x="440" y="252" class="node">Approval</text>
  </g>
  <path d="M192 218 C210 216 214 210 230 206 M372 206 C388 210 392 216 410 218" stroke="rgba(15,23,42,.25)" stroke-width="3" stroke-linecap="round"/>
  <rect x="78" y="322" width="444" height="34" rx="17" fill="rgba(255,255,255,.58)" stroke="rgba(255,255,255,.78)"/>
  <text x="112" y="344" class="small">priority credit</text>
  <text x="250" y="344" class="small">compromise score</text>
  <text x="408" y="344" class="small">fairness ledger</text>
  <rect x="1" y="1" width="598" height="378" rx="33" stroke="rgba(255,255,255,.9)"/>
</svg>
