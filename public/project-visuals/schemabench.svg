<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F8FF"/><stop offset=".48" stop-color="#ECEEFF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4338CA"/><stop offset="1" stop-color="#1E293B"/></linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1B2B48" flood-opacity=".14"/></filter>
    <style>
      .title{font:700 32px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827;letter-spacing:-.02em}.kicker{font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748B}.chip{font:700 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#475569;text-transform:uppercase;letter-spacing:.08em}.node{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#243044}.mono{font:600 15px 'SF Mono',Consolas,monospace;fill:#1F2937}.monoAccent{font:700 15px 'SF Mono',Consolas,monospace;fill:#4338CA}
    </style>
  </defs>
  <rect width="600" height="380" rx="34" fill="url(#bg)"/>
  <circle cx="92" cy="76" r="118" fill="#4338CA" opacity=".14"/>
  <circle cx="502" cy="80" r="130" fill="#1E293B" opacity=".12"/>
  <path d="M-20 306 C92 242 182 332 286 274 S492 214 640 282 V420 H-20 Z" fill="rgba(255,255,255,.42)"/>
  <text x="48" y="62" class="title">SchemaBench</text>
  <text x="50" y="88" class="kicker">Does the model honor the schema?</text>
  <rect x="424" y="48" width="116" height="32" rx="16" fill="rgba(255,255,255,.68)" stroke="rgba(255,255,255,.78)"/><text x="438" y="69" class="chip">8 models</text>

  <rect x="48" y="138" width="504" height="190" rx="24" fill="rgba(255,255,255,0.62)" stroke="rgba(255,255,255,.78)"/>
  <text x="72" y="168" class="chip">Contract adherence by mode</text>

  <g>
    <text x="72" y="200" class="mono">prompt-only</text>
    <circle cx="230" cy="196" r="9" fill="#DC2626"/>
    <circle cx="256" cy="196" r="9" fill="#22C55E"/>
    <circle cx="282" cy="196" r="9" fill="#22C55E"/>
    <circle cx="308" cy="196" r="9" fill="#DC2626"/>
  </g>
  <g>
    <text x="72" y="234" class="mono">tool-call</text>
    <circle cx="230" cy="230" r="9" fill="#22C55E"/>
    <circle cx="256" cy="230" r="9" fill="#22C55E"/>
    <circle cx="282" cy="230" r="9" fill="#DC2626"/>
    <circle cx="308" cy="230" r="9" fill="#22C55E"/>
  </g>
  <g>
    <text x="72" y="268" class="mono">response_format</text>
    <circle cx="230" cy="264" r="9" fill="#22C55E"/>
    <circle cx="256" cy="264" r="9" fill="#22C55E"/>
    <circle cx="282" cy="264" r="9" fill="#22C55E"/>
    <circle cx="308" cy="264" r="9" fill="#22C55E"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="360" y="180" width="156" height="112" rx="20" fill="rgba(255,255,255,.78)" stroke="rgba(255,255,255,.85)"/>
    <text x="380" y="208" class="chip">Mechanical grade</text>
    <text x="380" y="238" class="monoAccent">{ }</text>
    <text x="380" y="266" class="node">not an LLM judge</text>
  </g>

  <rect x="48" y="336" width="220" height="30" rx="15" fill="rgba(255,255,255,.68)" stroke="rgba(255,255,255,.78)"/><text x="62" y="356" class="chip">175 tests · exact McNemar</text>
  <rect x="1" y="1" width="598" height="378" rx="33" stroke="rgba(255,255,255,.9)"/>
</svg>
