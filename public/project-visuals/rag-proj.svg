<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset=".5" stop-color="#EAF2FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B63CE"/><stop offset="1" stop-color="#20A4B8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1B2B48" flood-opacity=".14"/></filter>
    <style>
      .title{font:700 32px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827}.kicker{font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748B}.chip{font:700 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#475569;text-transform:uppercase;letter-spacing:.08em}.node{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#243044}.metric{font:800 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0B63CE}.label{font:700 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748B}
    </style>
  </defs>
  <rect width="600" height="380" rx="34" fill="url(#bg)"/>
  <circle cx="98" cy="80" r="124" fill="#0B63CE" opacity=".16"/>
  <circle cx="512" cy="96" r="132" fill="#20A4B8" opacity=".14"/>
  <path d="M-18 308 C86 238 178 330 286 274 S492 214 642 282 V420 H-18 Z" fill="rgba(255,255,255,.42)"/>
  <text x="48" y="62" class="title">RAG Eval Lab</text>
  <text x="50" y="88" class="kicker">retrieval quality -> cited answers -> CI gate</text>
  <rect x="424" y="48" width="128" height="32" rx="16" fill="rgba(255,255,255,.68)" stroke="rgba(255,255,255,.78)"/><text x="442" y="69" class="chip">100 questions</text>
  <g filter="url(#shadow)">
    <rect x="48" y="132" width="156" height="188" rx="24" fill="rgba(255,255,255,.66)" stroke="rgba(255,255,255,.8)"/>
    <text x="74" y="166" class="node">Benchmark</text>
    <path d="M76 196 H176 M76 222 H160 M76 248 H184 M76 274 H150" stroke="rgba(15,23,42,.22)" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="234" y="132" width="146" height="188" rx="24" fill="rgba(255,255,255,.66)" stroke="rgba(255,255,255,.8)"/>
    <text x="262" y="166" class="node">Retriever</text>
    <circle cx="306" cy="226" r="46" fill="url(#accent)" opacity=".9"/>
    <path d="M282 226 H330 M306 202 V250" stroke="white" stroke-width="7" stroke-linecap="round" opacity=".86"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="410" y="132" width="142" height="188" rx="24" fill="rgba(255,255,255,.66)" stroke="rgba(255,255,255,.8)"/>
    <text x="442" y="166" class="node">CI Gate</text>
    <text x="440" y="224" class="metric">0.960</text>
    <text x="442" y="246" class="label">RECALL@5</text>
    <text x="440" y="286" class="metric">0.030</text>
    <text x="442" y="308" class="label">HALLUCINATION</text>
  </g>
  <path d="M204 226 C218 226 220 226 234 226 M380 226 C394 226 396 226 410 226" stroke="rgba(15,23,42,.25)" stroke-width="3" stroke-linecap="round"/>
  <rect x="1" y="1" width="598" height="378" rx="33" stroke="rgba(255,255,255,.9)"/>
</svg>
