<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF7F7"/><stop offset=".48" stop-color="#FDECEC"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DC2626"/><stop offset="1" stop-color="#7C2D12"/></linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#450A0A" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6 Z" fill="rgba(15,23,42,.3)"/></marker>
    <style>
      .title{font:700 32px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827;letter-spacing:-.02em}.kicker{font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748B}.body{font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#334155}.chip{font:700 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#475569;text-transform:uppercase;letter-spacing:.08em}.node{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#243044}.white{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:white}.mono{font:600 15px 'SF Mono',Consolas,monospace;fill:#1F2937}.monoAccent{font:700 15px 'SF Mono',Consolas,monospace;fill:#DC2626}
    </style>
  </defs>
  <rect width="600" height="380" rx="34" fill="url(#bg)"/>
  <circle cx="92" cy="76" r="118" fill="#DC2626" opacity=".14"/>
  <circle cx="502" cy="80" r="130" fill="#7C2D12" opacity=".13"/>
  <path d="M-20 306 C92 242 182 332 286 274 S492 214 640 282 V420 H-20 Z" fill="rgba(255,255,255,.42)"/>
  <text x="48" y="62" class="title">Argus</text>
  <text x="50" y="88" class="kicker">Live fraud scoring, explained</text>
  <rect x="428" y="48" width="112" height="32" rx="16" fill="rgba(255,255,255,.68)" stroke="rgba(255,255,255,.78)"/><text x="442" y="69" class="chip">52 tests</text>
  <rect x="48" y="138" width="230" height="190" rx="24" fill="rgba(255,255,255,0.62)" stroke="rgba(255,255,255,.78)"/>
  <text x="72" y="168" class="chip">Transaction stream</text>
  <polyline points="72,296 106,262 136,278 168,232 200,254 232,204 250,224" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="168" cy="232" r="9" fill="#DC2626"/>
  <circle cx="168" cy="232" r="16" fill="none" stroke="#DC2626" stroke-width="2" opacity=".5"/>
  <rect x="72" y="304" width="90" height="18" rx="9" fill="rgba(220,38,38,.14)"/><text x="82" y="317" class="chip" style="fill:#B91C1C">flagged</text>
  <g filter="url(#softShadow)"><rect x="302" y="156" width="120" height="54" rx="20" fill="rgba(255,255,255,.74)" stroke="rgba(255,255,255,.8)"/><circle cx="328" cy="183" r="7" fill="#DC2626"/><text x="346" y="189" class="node">XGB + IForest</text></g>
  <g filter="url(#softShadow)"><rect x="458" y="156" width="118" height="54" rx="20" fill="rgba(255,255,255,.74)" stroke="rgba(255,255,255,.8)"/><circle cx="484" cy="183" r="7" fill="#DC2626"/><text x="502" y="189" class="node">SHAP</text></g>
  <path d="M422 183 C439 183, 439 183, 458 183" fill="none" stroke="rgba(15,23,42,.28)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="314" y="252" width="262" height="118" rx="26" fill="rgba(255,255,255,0.58)" stroke="rgba(255,255,255,.78)"/>
  <text x="338" y="286" class="body">Risk score</text>
  <text x="338" y="316" class="monoAccent" font-size="28">87 / 100</text>
  <path d="M340 336 H576" stroke="rgba(15,23,42,.15)" stroke-width="8" stroke-linecap="round"/>
  <path d="M340 336 H492" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>
  <rect x="1" y="1" width="598" height="378" rx="33" stroke="rgba(255,255,255,.9)"/>
</svg>
