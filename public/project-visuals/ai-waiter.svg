<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset=".48" stop-color="#EAF2FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EA580C"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1B2B48" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6 Z" fill="rgba(15,23,42,.3)"/></marker>
    <style>
      .title{font:700 32px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#111827;letter-spacing:-.02em}.kicker{font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748B}.body{font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#334155}.chip{font:700 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#475569;text-transform:uppercase;letter-spacing:.08em}.node{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#243044}.white{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:white}.mono{font:600 15px 'SF Mono',Consolas,monospace;fill:#1F2937}.monoAccent{font:700 15px 'SF Mono',Consolas,monospace;fill:#EA580C}.emoji{font:400 30px 'Segoe UI Emoji','Apple Color Emoji',sans-serif;fill:white}
    </style>
  </defs>
  <rect width="600" height="380" rx="34" fill="url(#bg)"/>
  <circle cx="92" cy="76" r="118" fill="#EA580C" opacity=".16"/>
  <circle cx="502" cy="80" r="130" fill="#F59E0B" opacity=".15"/>
  <path d="M-20 306 C92 242 182 332 286 274 S492 214 640 282 V420 H-20 Z" fill="rgba(255,255,255,.42)"/>
  <text x="48" y="62" class="title">AI Waiter</text>
  <text x="50" y="88" class="kicker">Chat, cart, checkout</text>
  <rect x="448" y="48" width="124" height="32" rx="16" fill="rgba(255,255,255,.68)" stroke="rgba(255,255,255,.78)"/><text x="462" y="69" class="chip">Tool calling</text>
  <rect x="48" y="134" width="254" height="218" rx="24" fill="rgba(255,255,255,0.62)" stroke="rgba(255,255,255,.78)"/><rect x="74" y="162" width="212" height="32" rx="16" fill="rgba(255,255,255,.68)" stroke="rgba(255,255,255,.78)"/><text x="88" y="183" class="chip">What pairs with paneer?</text><rect x="74" y="214" width="174" height="44" rx="18" fill="#EA580C" opacity=".92"/><text x="94" y="242" class="white">Try dal makhani</text><rect x="344" y="144" width="194" height="202" rx="28" fill="rgba(255,255,255,0.66)" stroke="rgba(255,255,255,.78)"/><circle cx="392" cy="204" r="34" fill="url(#accentGrad)"/><text x="376" y="214" class="emoji">??</text><text x="382" y="272" class="body">Cart: 3 items</text><rect x="378" y="296" width="164" height="32" rx="16" fill="rgba(255,255,255,.68)" stroke="rgba(255,255,255,.78)"/><text x="392" y="317" class="chip">WhatsApp checkout</text>
  <rect x="1" y="1" width="598" height="378" rx="33" stroke="rgba(255,255,255,.9)"/>
</svg>